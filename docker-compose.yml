services:
  kafka:
    image: apache/kafka:4.1.2
    container_name: streaming_kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_LISTENERS: PLAINTEXT://:29092,CONTROLLER://:29093,PLAINTEXT_HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT

      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

    volumes:
      - kafka_data:/var/lib/kafka/data

  postgres:
    image: postgres:15
    container_name: streaming_postgres
    environment:
      POSTGRES_DB: streaming_orders
      POSTGRES_USER: streaming_user
      POSTGRES_PASSWORD: streaming_pass
    ports:
      - "5435:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U streaming_user -d streaming_orders"
        ]
      interval: 5s
      timeout: 5s
      retries: 10
  spark:
    image: apache/spark:4.2.0-scala2.13-java17-python3-r-ubuntu
    container_name: streaming_spark
    depends_on:
      - kafka
      - postgres
    environment:
      SPARK_SUBMIT_OPTS: "-Divy.home=/opt/spark-ivy -Divy.cache.dir=/opt/spark-ivy/cache"
    volumes:
      - ./spark:/opt/spark-apps
      - ./data/checkpoints:/opt/spark-checkpoints
      - ./data/ivy:/opt/spark-ivy
    command: [ "sleep", "infinity" ]
volumes:
  kafka_data:
  postgres_data: